[project]
name = "devinmobile"
version = "0.1.0"
description = "Discord front-end for Devin Cloud sessions"
requires-python = ">=3.13"
dependencies = [
    "discord.py==2.7.1",
    "httpx==0.28.1",
    "aiosqlite==0.21.0",
    "pydantic>=2.12,<3",
    "pydantic-settings==2.10.1",
    "PyJWT[crypto]==2.10.1",
    "trafilatura==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "ruff==0.13.1",
    "mypy==1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devinmobile"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = false
